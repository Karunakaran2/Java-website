<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/layout}">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />


<head>
	<title>karan Admin - Contact applications</title>



	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
</head>
<main role="main" class="" layout:fragment="content">


	<div class="pt-5 mt-5">
		<div class="container mt-4">
			<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1">
				<div class="d-flex justify-content-between align-items-center flex-wrap">
					<h3 class="mb-0">📄 Whitepapers Published</h3>
					<button class="btn btn-primary mt-2 mt-md-0" data-bs-toggle="modal"
						data-bs-target="#addWhitepaperModal"  data-bs-dev="sgk125">
						<i class="bi bi-plus-circle me-1"></i> Add Whitepaper
					</button>
				</div>
			</div>

			<div class="table-responsive">
				<table class="table table-bordered align-middle text-center">
					<thead class="table-dark">
						<tr>
							<th scope="col">ID</th>
							<th scope="col" class="text-start">Title</th>
							<th scope="col">Description</th>
							<th scope="col">PDF</th>
							<th scope="col">Published Date</th>
							<th scope="col">Actions</th>

							<!--<th>Image</th>-->
						</tr>
					</thead>
					<tbody>
						<tr th:if="${#lists.isEmpty(whitepapers)}">
							<td colspan="5" class="text-center text-muted">No Whitepapers are published so far.</td>
						</tr>
						<tr th:each="whitepaper : ${whitepapers}">
							<td th:text="${whitepaper.id}">1</td>
							<td th:text="${whitepaper.title}">Sample Title</td>
							<td th:text="${whitepaper.description}">Short Description</td>
							<td>
								<a th:href="@{/admin/whitepapers/pdf/{id}(id=${whitepaper.id})}" target="_blank">View
									PDF</a>
							</td>
							<td th:text="${whitepaper.publishedDate}">2025-07-07</td>
							<td>
								<div class="d-flex flex-wrap gap-2 justify-content-center">


									<button type="button" class="btn btn-sm btn-outline-warning open-edit-modal-btn"
										th:attr="data-bs-target='#editWhitepaperModal__' + ${whitepaper.id}"
										data-bs-toggle="modal" title="Edit">
										<i class="fas fa-edit"></i>
									</button>
									<form th:action="@{'/admin/whitepapers/toggle/' + ${whitepaper.id}}" method="post"
										th:object="${whitepaper}" th:id="'toggleForm_' + ${whitepaper.id}"
										style="display:inline;">
										<input type="hidden" name="status"
											th:value="${whitepaper.disableStatus == 'Y'} ? 'N' : 'Y'" />

										<!-- CSRF Token -->
										<input type="hidden" th:name="${_csrf.parameterName}"
											th:value="${_csrf.token}" />

										<button type="submit" class="btn btn-sm"
											th:classappend="${whitepaper.disableStatus == 'Y'} ? 'btn-success' : 'btn-danger'"
											th:text="${whitepaper.disableStatus == 'Y'} ? 'Enable' : 'Disable'">
										</button>
									</form>
								</div>
							</td>
						</tr>
					</tbody>
				</table>
			</div>

		</div>

	</div>

	<!-- Modal -->
	<div class="modal fade" id="addWhitepaperModal" tabindex="-1" aria-labelledby="addWhitepaperModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">

				<form th:action="@{/admin/whitepapers/add}" method="post" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title" id="addWhitepaperModalLabel">Add New Whitepaper</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
					</div>

					<div class="modal-body">
						<div class="mb-3">
							<label for="title" class="form-label">Title</label>
							<input type="text" class="form-control" name="title" id="title" required>
						</div>

						<div class="mb-3">
							<label for="description" class="form-label">Short Description</label>
							<textarea class="form-control" name="description" id="description" rows="3"></textarea>
						</div>

						<div class="mb-3">
							<label for="publishedDate" class="form-label">Published Date</label>
							<input type="date" class="form-control" name="publishedDate" id="publishedDate" required>
						</div>

						<div class="mb-3">
							<label for="pdf" class="form-label">Upload PDF</label>
							<span><small class="text-danger">Max size - 10MB</small></span>
							<input type="file" class="form-control" name="pdf" id="pdf" accept=".pdf" required>
						</div>

						<div class="mb-3">
							<label for="image" class="form-label">Upload Image </label>
							<span><small class="text-danger">650 × 430 pixels is good fit</small></span>
							<input type="file" class="form-control" name="image" id="image" accept="image/*">
						</div>
					</div>

					<div class="modal-footer">
						<button type="submit" class="btn btn-success">Submit</button>
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>

			</div>
		</div>
	</div>
	<!-- Modal Per Whitepaper -->
	<div th:each="whitepaper : ${whitepapers}">
		<div class="modal fade" th:id="'editWhitepaperModal__' + ${whitepaper.id}" tabindex="-1"
			aria-labelledby="editWhitepaperModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-xl">
				<div class="modal-content">
					<form th:action="@{/admin/whitepapers/edit}" method="post" enctype="multipart/form-data">

						<input type="hidden" name="id" th:value="${whitepaper.id}" />

						<div class="modal-header">
							<h5 class="modal-title">Edit Whitepaper</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
						</div>

						<div class="modal-body">
							<div class="row">
								<!-- Left: Form -->
								<div class="col-md-6">
									<div class="mb-3">
										<label for="title" class="form-label">Title</label>
										<input type="text" class="form-control" name="title"
											th:value="${whitepaper.title}" required>
									</div>

									<div class="mb-3">
										<label for="description" class="form-label">Short Description</label>
										<textarea class="form-control" name="description" rows="3"
											th:text="${whitepaper.description}"></textarea>
									</div>

									<div class="mb-3">
										<label for="publishedDate" class="form-label">Published Date</label>
										<input type="date" class="form-control" name="publishedDate"
											th:value="${whitepaper.publishedDate}" required>
									</div>

									<div class="mb-3">
										<label class="form-label">Replace PDF (optional)</label>
										<input type="file" class="form-control" name="pdf" accept=".pdf">
									</div>

									<div class="mb-3">
										<label class="form-label">Replace Image (optional)</label>
										<input type="file" class="form-control" name="image" accept="image/*">
									</div>
								</div>

								<!-- Right: Preview -->
								<div class="col-md-6">
									<div class="mb-3">
										<label class="form-label">Current PDF:</label>
										<iframe th:src="@{/admin/whitepapers/pdf/{id}(id=${whitepaper.id})}"
											width="100%" height="300px" frameborder="0"></iframe>
									</div>

									<div class="mb-3">
										<label class="form-label">Current Image:</label><br />
										<img th:src="@{/admin/whitepapers/image/{id}(id=${whitepaper.id})}"
											class="img-fluid" style="max-height: 200px;" alt="No image" />
									</div>
								</div>
							</div>
						</div>

						<div class="modal-footer">
							<button type="submit" class="btn btn-success">Update</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						</div>

					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Toast Container -->
	<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
		<div th:if="${success}" class="toast align-items-center text-white bg-success border-0 show" role="alert"
			aria-live="assertive" aria-atomic="true">
			<div class="d-flex">
				<div class="toast-body">
					<span th:text="${success}"></span>
				</div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
					aria-label="Close"></button>
			</div>
		</div>

		<div th:if="${error}" class="toast align-items-center text-white bg-danger border-0 show" role="alert"
			aria-live="assertive" aria-atomic="true">
			<div class="d-flex">
				<div class="toast-body">
					<span th:text="${error}"></span>
				</div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"
					aria-label="Close"></button>
			</div>
		</div>
	</div>
	<script>
		function toggleWhitepaperStatus(button) {
			const id = button.getAttribute("data-id");
			const action = button.getAttribute("data-action");

			const confirmMsg = action === 'disable' ? "Disable this whitepaper?" : "Enable this whitepaper?";
			if (!confirm(confirmMsg)) return;

			const csrfToken = document.querySelector("meta[name='_csrf']").getAttribute("content");
			const csrfHeader = document.querySelector("meta[name='_csrf_header']").getAttribute("content");

			fetch(`/admin/whitepapers/${action}/${id}`, {
				method: 'POST',
				headers: {
					'X-Requested-With': 'XMLHttpRequest',
					[csrfHeader]: csrfToken
				}
			})
				.then(response => {
					if (response.ok) {
						alert(`Whitepaper ${action}d successfully!`);
						location.reload();
					} else {
						alert(`Failed to ${action} whitepaper`);
					}
				});
		}


		document.addEventListener('DOMContentLoaded', function () {

			const toastElList = [].slice.call(document.querySelectorAll('.toast'))
			toastElList.forEach(function (toastEl) {
				new bootstrap.Toast(toastEl, {delay: 4000}).show()
			});

		});
	</script>

</main>

</html>
