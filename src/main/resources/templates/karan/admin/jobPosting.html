<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">


<head>
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
	<title>karan Admin - Jobs</title>
	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
	<link rel="stylesheet" th:href="@{/website/css/dropzone.min.css}" />
	<script th:src="@{/website/js/dropzone.min.js}"></script>
</head>

<main layout:fragment="content">
	<div class="container pt-5 mt-5">
		<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1 mt-4">
			<div class="d-flex justify-content-between align-items-center flex-wrap">
				<h3 class="mb-0">💼 Manage Job Openings</h3>
				<button class="btn btn-primary mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#addJobModal">
					<i class="bi bi-plus-circle me-1"></i> Add Job
				</button>
			</div>
		</div>


		<div class="container">
			<div th:if="${jobs != null && #lists.isEmpty(jobs) == false}">
				<div class="table-responsive">
					<table class="table table-bordered table-hover align-middle text-start">
						<thead class="table-light">
							<tr>
								<th>Job Title</th>
								<th>Department</th>
								<th>Type</th>
								<th>Experience</th>
								<th>Location</th>
								<th>Last Date</th>
								<th>Status</th>
								<th>Actions</th>
							</tr>
						</thead>
						<tbody>
							<tr th:each="job : ${jobs}" style="vertical-align: top;">
								<td style="padding: 1.5rem;">
									<strong th:text="${job.title}">Senior Consultant</strong>
								</td>
								<td style="padding: 1.5rem;" th:text="${job.department}">Research</td>
								<td style="padding: 1.5rem;" th:text="${job.jobType}">Full Time</td>
								<td style="padding: 1.5rem;" th:text="${job.experience}">2-3 Years</td>
								<td style="padding: 1.5rem;" th:text="${job.location}">Remote</td>
								<td style="padding: 1.5rem;">
									<span th:text="${#temporals.format(job.lastDate, 'yyyy-MM-dd')}">2025-09-09</span>
								</td>
								<td style="padding: 1.5rem;">
									<span class="badge"
										th:classappend="${job.activeStatus == 'Y'} ? 'bg-success' : 'bg-secondary'"
										th:text="${job.activeStatus == 'Y'} ? 'Active' : 'Inactive'">Active</span>
								</td>
								<td style="padding: 1.5rem;">
									<div class="d-flex gap-2">
										<form th:action="@{'/admin/job-posting/toggle/' + ${job.id}}" method="post">
											<input type="hidden" name="status"
												th:value="${job.activeStatus == 'Y'} ? 'N' : 'Y'" />
											<input type="hidden" th:name="${_csrf.parameterName}"
												th:value="${_csrf.token}" />
											<button type="submit" class="btn btn-sm"
												th:classappend="${job.activeStatus == 'Y'} ? 'btn-danger' : 'btn-success'"
												th:text="${job.activeStatus == 'Y'} ? 'Deactivate' : 'Activate'">
											</button>
										</form>

										<button class="btn btn-sm btn-warning" data-bs-toggle="modal"
											th:attr="data-bs-target='#editJobModal__' + ${job.id}">
											<i class="fas fa-edit me-1"></i> Edit
										</button>
									</div>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>

			<div th:if="${jobs == null || #lists.isEmpty(jobs)}" class="text-center text-muted py-5">
				<i class="fas fa-folder-open fa-3x mb-3"></i>
				<p>No job openings have been added yet.</p>
			</div>
		</div>

	</div>

	<!-- 🔘 Add Job Modal -->
	<div class="modal fade" id="addJobModal" tabindex="-1" aria-hidden="true">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
				<form th:action="@{/admin/job-posting/add}" method="post" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title">Add Job Opening</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>

					<div class="modal-body row g-3">
						<div class="col-md-6">
							<label class="form-label">Job Title</label>
							<input type="text" class="form-control" name="title" required />
						</div>
						<div class="col-md-6">
							<label class="form-label">Department</label>
							<input type="text" class="form-control" name="department" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Job Type</label>
							<select class="form-select" name="jobType">
								<option value="Full-Time">Full-Time</option>
								<option value="Part-Time">Part-Time</option>
								<option value="Contractual">Contractual</option>
								<option value="Freelance">Freelance</option>
								<option value="Internship">Internship</option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Location</label>
							<input type="text" class="form-control" name="location" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Experience</label>
							<input type="text" class="form-control" name="experience" />
						</div>
						<div class="col-md-6">
							<label class="form-label">No. of Vacancies</label>
							<input type="number" class="form-control" name="noOfVacancies" />
						</div>
						<label class="form-label">Gender Preference</label>
						<select class="form-select" name="genderPreference">
							<option value="">-- Select (optional) --</option>
							<option value="Male">Male</option>
							<option value="Female">Female</option>
							<option value="Any">Any</option>
						</select>

						<div class="col-md-6">
							<label class="form-label">Last Date to Apply</label>
							<input type="date" class="form-control" name="lastDate" required />
						</div>
						<div class="col-12">
							<label class="form-label">Job Description</label>
							<textarea id="jobDescription" name="jobDescription" class="form-control"
								rows="4"></textarea>
						</div>
						<div class="col-12">
							<label class="form-label">Requirements</label>
							<textarea id="requirements" name="requirements" class="form-control" rows="3"></textarea>
						</div>
						<div class="col-12">
							<label class="form-label">Responsibilities</label>
							<textarea id="responsibilities" name="responsibilities" class="form-control"
								rows="3"></textarea>
						</div>
						<div class="col-12">
							<label class="form-label">Skills</label>
							<textarea class="form-control" name="skillSet" rows="2"></textarea>
						</div>
						<div class="col-12">
							<label class="form-label">Education</label>
							<textarea class="form-control" name="education" rows="2"></textarea>
						</div>
						<div class="col-12">
							<label class="form-label">Additional Tags</label>
							<textarea class="form-control" name="additionalTags" rows="2"
								placeholder="e.g. Immediate hiring, Women returning to work, Freshers welcome"></textarea>
						</div>
					</div>

					<div class="modal-footer">
						<button type="submit" class="btn btn-success">Add Job</button>
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- 📝 Edit Modals (one per job) -->
	<div th:each="job : ${jobs}">
		<div class="modal fade" th:id="'editJobModal__' + ${job.id}" tabindex="-1">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<form th:action="@{'/admin/job-posting/edit/' + ${job.id}}" method="post">
						<div class="modal-header">
							<h5 class="modal-title">Edit Job</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>
						<div class="modal-body row g-3">

							<!-- Title -->
							<div class="col-md-6">
								<label class="form-label">Title</label>
								<input type="text" class="form-control" name="title" th:value="${job.title}" required>
							</div>

							<!-- Department -->
							<div class="col-md-6">
								<label class="form-label">Department</label>
								<input type="text" class="form-control" name="department" th:value="${job.department}">
							</div>

							<!-- Job Type -->
							<div class="col-md-6">
								<label class="form-label">Job Type</label>
								<select class="form-control" name="jobType">
									<option th:selected="${job.jobType == 'Full-time'}">Full-time</option>
									<option th:selected="${job.jobType == 'Part-time'}">Part-time</option>
									<option th:selected="${job.jobType == 'Contract'}">Contract</option>
									<option th:selected="${job.jobType == 'Freelance'}">Freelance</option>
								</select>
							</div>

							<!-- Experience -->
							<div class="col-md-6">
								<label class="form-label">Experience</label>
								<input type="text" class="form-control" name="experience" th:value="${job.experience}">
							</div>

							<!-- Location -->
							<div class="col-md-6">
								<label class="form-label">Location</label>
								<input type="text" class="form-control" name="location" th:value="${job.location}">
							</div>

							<!-- Gender Preference -->
							<div class="col-md-6">
								<label class="form-label">Gender Preference</label>
								<select class="form-control" name="genderPreference">
									<option value="">-- Optional --</option>
									<option value="Male" th:selected="${job.genderPreference == 'Male'}">Male</option>
									<option value="Female" th:selected="${job.genderPreference == 'Female'}">Female
									</option>
									<option value="Other" th:selected="${job.genderPreference == 'Other'}">Other
									</option>
								</select>
							</div>

							<!-- Last Date -->
							<div class="col-md-6">
								<label class="form-label">Last Date to Apply</label>
								<input type="date" class="form-control" name="lastDate"
									th:value="${#temporals.format(job.lastDate, 'yyyy-MM-dd')}">
							</div>

							<!-- Number of Vacancies -->
							<div class="col-md-6">
								<label class="form-label">No. of Vacancies</label>
								<input type="text" class="form-control" name="noOfVacancies"
									th:value="${job.noOfVacancies}">
							</div>

							<!-- Job Description -->
							<div class="col-md-12">
								<label class="form-label">Job Description</label>
								<textarea class="form-control ckeditor" name="jobDescription" rows="4"
									th:text="${job.jobDescription}"></textarea>
							</div>

							<!-- Requirements -->
							<div class="col-md-12">
								<label class="form-label">Requirements</label>
								<textarea class="form-control ckeditor" name="requirements" rows="3"
									th:text="${job.requirements}"></textarea>
							</div>

							<!-- Responsibilities -->
							<div class="col-md-12">
								<label class="form-label">Responsibilities</label>
								<textarea class="form-control ckeditor" name="responsibilities" rows="3"
									th:text="${job.responsibilities}"></textarea>
							</div>

							<!-- Skills -->
							<div class="col-md-12">
								<label class="form-label">Skills</label>
								<textarea class="form-control" name="skillSet" rows="2"
									th:text="${job.skillSet}"></textarea>
							</div>

							<!-- Education -->
							<div class="col-md-12">
								<label class="form-label">Education</label>
								<textarea class="form-control" name="education" rows="2"
									th:text="${job.education}"></textarea>
							</div>

							<!-- Tags -->
							<div class="col-md-12">
								<label class="form-label">Additional Tags</label>
								<textarea class="form-control" name="additionalTags" rows="2"
									th:text="${job.additionalTags}"></textarea>
							</div>

						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-success">Update</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<script>
		// Initialize CKEditor on relevant fields
		CKEDITOR.replace('jobDescription');
		CKEDITOR.replace('requirements');
		CKEDITOR.replace('responsibilities');
	</script>
</main>



</main>

</html>
