<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/layout}">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<head>
	<title>karan Admin - Job Applications</title>
	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
</head>

<main role="main" class="" layout:fragment="content">

	<div class="pt-5 mt-5">
		<div class="container mt-4">
			<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1">
				<div class="d-flex justify-content-between align-items-center flex-wrap">
					<h3 class="mb-0">📄 Job Applications</h3>
				</div>

			</div>
			<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1">
				<form th:action="@{/admin/job-applications}" method="get">
					<div class="row mt-3">
						<!-- Job Role Filter -->
						<div class="col-md-4 mb-3">
							<label for="careerFilter" class="form-label">Job Role</label>
							<select id="careerFilter" name="careerId" class="form-select">
								<option value="" th:selected="${careerFilter == null}">-- All Roles --</option>
								<option th:each="career : ${careers}" th:value="${career.id}" th:text="${career.title}"
									th:selected="${career.id == careerFilter}"></option>
							</select>
						</div>

						<!-- Date Range Filter -->
						<div class="col-md-3 mb-3">
							<label for="startDate" class="form-label">Start Date</label>
							<input type="date" id="startDate" name="startDate" class="form-control"
								value="${startDate}" />
						</div>
						<div class="col-md-3 mb-3">
							<label for="endDate" class="form-label">End Date</label>
							<input type="date" id="endDate" name="endDate" class="form-control" value="${endDate}" />
						</div>
						<div class="col-md-2 mb-4 d-flex justify-content-center align-items-end">
							<button type="submit" class="btn btn-primary">Apply Filters</button>
						</div>
					</div>


				</form>
			</div>

			<div class="table-responsive">
				<table class="table table-bordered align-middle text-center">
					<thead class="table-dark">
						<tr>
							<th scope="col">ID</th>
							<th scope="col">Candidate Name</th>
							<th scope="col">Email</th>
							<th scope="col">Phone</th>
							<th scope="col">Cover Letter</th>
							<th scope="col">Resume</th>
							<th scope="col">Applied On</th>
							<th scope="col">Status</th>
							<th scope="col">Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="app : ${careerApplications}">
							<td th:text="${app.id}">1</td>
							<td th:text="${app.fullName}">John Doe</td>
							<td th:text="${app.email}">johndoe@example.com</td>
							<td th:text="${app.phone}">+1234567890</td>
							<td th:text="${app.coverLetter}">Lorem ipsum...</td>
							<td>
								<a th:href="@{/uploads/resumes/{resumeNameInServer}(resumeNameInServer=${app.resumeNameInServer})}" target="_blank">View
									Resume</a>
							</td>
							<td th:text="${app.appliedOn}">2025-07-07</td>
							<td th:text="${app.applicationStatus}">Pending</td>
							<td>
								<div class="d-flex flex-wrap gap-2 justify-content-center">
									<form th:action="@{'/admin/applications/toggleStatus/' + ${app.id}}" method="post"
										th:id="'toggleStatusForm_' + ${app.id}" style="display:inline;">

										<input type="hidden" name="status"
											th:value="${app.applicationStatus == 'Accepted'} ? 'Rejected' : 'Accepted'" />
										<input type="hidden" th:name="${_csrf.parameterName}"
											th:value="${_csrf.token}" />

										<button type="submit" class="btn btn-sm"
											th:classappend="${app.applicationStatus == 'Accepted'} ? 'btn-danger' : 'btn-success'"
											th:text="${app.applicationStatus == 'Accepted'} ? 'Reject' : 'Accept'">
										</button>
									</form>
								</div>
							</td>
						</tr>

					</tbody>
				</table>
			</div>

		</div>

	</div>

</main>
