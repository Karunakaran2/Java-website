<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org"
	xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="~{layouts/layout}">


<head>
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
	<title>karan Admin - Gallery</title>
	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
	<link rel="stylesheet" th:href="@{/website/css/dropzone.min.css}" />
	<script th:src="@{/website/js/dropzone.min.js}"></script>
</head>

<main layout:fragment="content">

	<div class="pt-5 mt-5">
		<div class="container mt-4">
			<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1">
				<div class="d-flex justify-content-between align-items-center flex-wrap">
					<h3 class="mb-0">🖼️ Manage Gallery</h3>
					<button class="btn btn-primary mt-2 mt-md-0" data-bs-toggle="modal"
						data-bs-target="#addGalleryModal">
						<i class="bi bi-plus-circle me-1"></i> Add Gallery Group
					</button>
				</div>
			</div>


			<div class="row row-cols-1 row-cols-md-3 g-4"
				th:if="${galleryGroups != null and #lists.isEmpty(galleryGroups) == false}">
				<div class="col" th:each="gallery : ${galleryGroups}">
					<div class="card h-100 shadow-sm border-0">
						<div class="position-relative">
							<img th:src="@{${gallery.coverImagePath}}" class="card-img-top img-fluid rounded-top"
								alt="Gallery Cover" style="height: 220px; object-fit: cover;" />
							<span
								class="badge bg-primary position-absolute top-0 start-0 m-2 px-3 py-1 rounded-pill text-uppercase"
								th:text="${gallery.type}">Type</span>
						</div>
						<div class="card-body">
							<h5 class="card-title fw-semibold mb-2">
								<i class="fas fa-images me-2 text-secondary"></i>
								<span th:text="${gallery.title}">Gallery Title</span>
							</h5>
							<p class="mb-1 text-muted">
								<i class="fas fa-calendar-alt me-2"></i>
								<span th:text="${#temporals.format(gallery.eventDate, 'yyyy-MM-dd')}">Date</span>
							</p>
							<p class="mb-1 text-muted">
								<i class="fas fa-map-marker-alt me-2"></i>
								<span th:text="${gallery.location}">Location</span>
							</p>
							<p class="mb-0">
								<i class="fas fa-align-left me-2 text-muted"></i>
								<span th:text="${gallery.description}">Short description of the gallery group</span>
							</p>
						</div>
						<div
							class="card-footer bg-white border-top-0 d-flex justify-content-between align-items-center px-3 pb-3">
							<form th:action="@{'/admin/gallery/toggle/' + ${gallery.id}}" method="post" class="me-2">
								<input type="hidden" name="status"
									th:value="${gallery.deactiveStatus == 'Y'} ? 'N' : 'Y'" />
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
								<button type="submit" class="btn btn-sm"
									th:classappend="${gallery.deactiveStatus == 'Y'} ? 'btn-success' : 'btn-danger'"
									th:text="${gallery.deactiveStatus == 'Y'} ? 'Activate' : 'Deactivate'">
								</button>
							</form>

							<button type="button" class="btn btn-sm btn-warning"
								th:attr="data-bs-target='#editGalleryModal__' + ${gallery.id}" data-bs-toggle="modal">
								<i class="fas fa-edit me-1"></i> Edit
							</button>

							<button type="button" class="btn btn-sm btn-info" th:attr="data-gallery-id=${gallery.id}"
								onclick="openManageMediaModal(this)">

								<i class="fas fa-photo-video me-1"></i> Manage Media
							</button>


						</div>
					</div>
				</div>
			</div>


			<!-- Fallback message if no gallery groups -->
			<div class="text-center text-muted py-5" th:if="${galleryGroups == null or #lists.isEmpty(galleryGroups)}">
				<i class="fas fa-folder-open fa-3x mb-3"></i>
				<p class="mb-0">No gallery groups have been added yet.</p>
			</div>

		</div>
	</div>

	<!-- Add Gallery Modal -->
	<div class="modal fade" id="addGalleryModal" tabindex="-1" aria-labelledby="addGalleryModalLabel"
		aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<form th:action="@{/admin/gallery/add}" method="post" enctype="multipart/form-data">
					<div class="modal-header">
						<h5 class="modal-title">Add Gallery Group</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body row g-3">
						<div class="col-md-6">
							<label class="form-label">Title</label>
							<input type="text" class="form-control" name="title" required />
						</div>
						<div class="col-md-6">
							<label class="form-label">Type</label>
							<select class="form-control" name="type" required>
								<option value="" disabled selected>Select Type</option>
								<option value="Seminar">Seminar</option>
								<option value="Webinar">Webinar</option>
								<option value="Conference">Conference</option>
								<option value="Festival">Festival</option>
								<option value="Workshop">Workshop</option>
								<option value="Exhibition">Exhibition</option>
								<option value="Lecture">Lecture</option>
								<option value="Training">Training</option>
								<option value="Graduation">Graduation</option>
								<option value="Career Fair">Career Fair</option>
							</select>
						</div>

						<div class="col-md-6">
							<label class="form-label">Date</label>
							<input type="datetime-local" class="form-control" name="eventDate" required />
						</div>
						<div class="col-md-6">
							<label class="form-label">Location</label>
							<input type="text" class="form-control" name="location" />
						</div>
						<div class="col-md-12">
							<label class="form-label">Description</label>
							<textarea class="form-control" name="description" rows="3"></textarea>
						</div>
						<div class="col-md-12">
							<label class="form-label">Cover Image</label>
							<input type="file" class="form-control" name="coverImageFile" accept="image/*" />
						</div>
					</div>
					<div class="modal-footer">
						<button type="submit" class="btn btn-success">Save</button>
						<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
					</div>
				</form>
			</div>
		</div>
	</div>


	<div th:each="gallery : ${galleryGroups}">
		<div class="modal fade" th:id="'editGalleryModal__' + ${gallery.id}" tabindex="-1"
			aria-labelledby="editGalleryModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<form th:action="@{'/admin/gallery/edit/' + ${gallery.id}}" method="post"
						enctype="multipart/form-data">
						<div class="modal-header">
							<h5 class="modal-title">Edit Gallery Group</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>
						<div class="modal-body row g-3">
							<div class="col-md-6">
								<label class="form-label">Title</label>
								<input type="text" class="form-control" name="title" th:value="${gallery.title}"
									required />
							</div>
							<div class="col-md-6">
								<label class="form-label">Type</label>
								<select class="form-control" name="type" required>
									<option value="Seminar" th:selected="${gallery.type == 'Seminar'}">Seminar</option>
									<option value="Webinar" th:selected="${gallery.type == 'Webinar'}">Webinar</option>
									<option value="Conference" th:selected="${gallery.type == 'Conference'}">Conference
									</option>
									<option value="Festival" th:selected="${gallery.type == 'Festival'}">Festival
									</option>
									<option value="Workshop" th:selected="${gallery.type == 'Workshop'}">Workshop
									</option>
									<option value="Exhibition" th:selected="${gallery.type == 'Exhibition'}">Exhibition
									</option>
									<option value="Lecture" th:selected="${gallery.type == 'Lecture'}">Lecture</option>
									<option value="Training" th:selected="${gallery.type == 'Training'}">Training
									</option>
									<option value="Graduation" th:selected="${gallery.type == 'Graduation'}">Graduation
									</option>
									<option value="Career Fair" th:selected="${gallery.type == 'Career Fair'}">Career
										Fair</option>
								</select>
							</div>
							<div class="col-md-6">
								<label class="form-label">Date</label>
								<input type="datetime-local" class="form-control" name="eventDate"
									th:value="${#temporals.format(gallery.eventDate, 'yyyy-MM-dd''T''HH:mm')}"
									required />
							</div>
							<div class="col-md-6">
								<label class="form-label">Location</label>
								<input type="text" class="form-control" name="location"
									th:value="${gallery.location}" />
							</div>
							<div class="col-md-12">
								<label class="form-label">Description</label>
								<textarea class="form-control" name="description" rows="3"
									th:text="${gallery.description}"></textarea>
							</div>
							<div class="col-md-12">
								<label class="form-label">Cover Image (Optional)</label>
								<input type="file" class="form-control" name="coverImageFile" accept="image/*" />
								<small class="text-muted">Leave empty to keep current image.</small>
							</div>
						</div>
						<div class="modal-footer">
							<button type="submit" class="btn btn-success">Update</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>


	<!-- Media Management Modal -->
	<!-- Manage Media Modal -->
	<div class="modal fade" id="manageMediaModal" tabindex="-1">
		<div class="modal-dialog modal-xl">
			<div class="modal-content">
				<div class="modal-header">
					<h5 class="modal-title">Manage Media</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>
				<div class="modal-body">
					<input type="hidden" id="mediaGroupId" />

					<!-- Traditional Upload Form -->
					<form id="traditionalUploadForm" th:action="@{/admin/gallery/media/upload}" method="post"
						enctype="multipart/form-data" class="mb-4">
						<input type="hidden" name="groupId" id="formGroupId" />
						<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
						<div class="mb-3">
							<label class="form-label">Select Media Files (Images or Videos)</label>
							<input type="file" name="mediaFiles" class="form-control" accept="image/*,video/*" multiple
								required />
						</div>
						<button type="submit" class="btn btn-success">Upload</button>
					</form>

					<!-- Table of existing media -->
					<div class="table-responsive">
						<table class="table table-bordered">
							<thead>
								<tr>
									<th>Preview</th>
									<th>Type</th>
									<th>Size</th>
									<th>Action</th>
								</tr>
							</thead>
							<tbody id="mediaTableBody">
								<tr>
									<td colspan="4">No media loaded.</td>
								</tr>
							</tbody>
						</table>
					</div>
				</div>
				<div class="modal-footer">
					<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
				</div>
			</div>
		</div>
	</div>




	<script>
		function loadMediaTable(groupId) {
			const mediaGroupIdInput = document.querySelector('#mediaGroupId');
			const formGroupIdInput = document.querySelector('#formGroupId');
			const tbody = document.querySelector('#mediaTableBody');

			const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
			const csrfToken = csrfTokenMeta ? csrfTokenMeta.content : '';

			if (!mediaGroupIdInput || !formGroupIdInput || !tbody) {
				console.error("Required DOM elements not found.");
				return;
			}

			mediaGroupIdInput.value = groupId;
			formGroupIdInput.value = groupId;

			tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

			fetch(`/admin/gallery/${groupId}/media`)
				.then(response => response.json())
				.then(mediaList => {
					tbody.innerHTML = '';
					if (mediaList.length === 0) {
						tbody.innerHTML = '<tr><td colspan="4">No media found.</td></tr>';
					}
					mediaList.forEach(media => {
						const row = document.createElement('tr');
						row.innerHTML = `
							<td><img src="${media.filePath}" width="60"/></td>
							<td>${media.fileType}</td>
							<td>${Math.round(media.fileSize / 1024)} KB</td>
							<td>
								<form method="post" action="/admin/gallery/media/delete/${media.id}" style="display:inline" onsubmit="return deleteMedia(event, ${groupId})">
									<input type="hidden" name="_csrf" value="${csrfToken}" />
									<button class="btn btn-sm btn-danger" onclick="return confirm('Are you sure you want to delete this media?')">Remove</button>
								</form>
							</td>
						`;
						tbody.appendChild(row);
					});
				})
				.catch(err => {
					tbody.innerHTML = '<tr><td colspan="4">Error loading media.</td></tr>';
					console.error('Error loading media:', err);
				});
		}

		document.addEventListener('DOMContentLoaded', function () {
			window.openManageMediaModal = function (button) {
				const groupId = button.getAttribute('data-gallery-id');
				console.log(groupId);

				const mediaGroupIdInput = document.querySelector('#mediaGroupId');
				const formGroupIdInput = document.querySelector('#formGroupId');
				const tbody = document.querySelector('#mediaTableBody');

				if (!mediaGroupIdInput || !formGroupIdInput || !tbody) {
					console.error("Required DOM elements not found.");
					return;
				}

				mediaGroupIdInput.value = groupId;
				formGroupIdInput.value = groupId;

				tbody.innerHTML = '<tr><td colspan="4">Loading...</td></tr>';

				const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
				const csrfToken = csrfTokenMeta ? csrfTokenMeta.content : '';

				loadMediaTable(groupId);

				const modalEl = document.getElementById('manageMediaModal');
				if (modalEl) {
					const modal = new bootstrap.Modal(modalEl);
					modal.show();
				} else {
					console.error("Modal element not found.");
				}
			};

			const uploadForm = document.querySelector('#traditionalUploadForm');
			if (uploadForm) {
				uploadForm.addEventListener('submit', function (e) {
					e.preventDefault(); // prevent normal form submit

					const formData = new FormData(uploadForm);

					const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
					const csrfHeader = document.querySelector('meta[name="_csrf_header"]');

					fetch(uploadForm.action, {
						method: 'POST',
						body: formData,
						headers: {
							[csrfHeader.content]: csrfTokenMeta.content
						}
					})
						.then(res => res.json())
						.then(data => {
							showToast(data.message, data.status); // show toast
							const groupId = document.querySelector('#mediaGroupId').value;
							loadMediaTable(groupId);
						})
						.catch(error => {
							console.error('Upload failed:', error);
							showToast('Upload failed. Please try again.', 'error');
						});
				});
			}
		});

		function deleteMedia(event, groupId) {
			event.preventDefault();
			const form = event.target;
			const formData = new FormData(form);
			const csrfTokenMeta = document.querySelector('meta[name="_csrf"]');
			const csrfHeader = document.querySelector('meta[name="_csrf_header"]');

			if (!csrfTokenMeta || !csrfHeader) {
				console.error("CSRF token or header missing.");
				showToast('Internal error. Please refresh the page.', 'error');
				return false;
			}

			fetch(form.action, {
				method: 'POST',
				headers: {
					[csrfHeader.content]: csrfTokenMeta.content
				},
				body: formData
			})
				.then(response => response.json())
				.then(data => {
					if (data.status === 'success') {
						showToast(data.message || 'Media removed successfully', 'success');
						loadMediaTable(groupId);
					} else {
						showToast(data.message || 'Failed to remove media.', 'error');
					}
				})
				.catch(error => {
					console.error('Delete failed:', error);
					showToast('Error during media delete.', 'error');
				});

			return false;
		}


	</script>




</main>

</html>
