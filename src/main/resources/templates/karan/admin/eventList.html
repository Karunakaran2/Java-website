<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/layout}">
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<meta name="_csrf" th:content="${_csrf.token}" />
<meta name="_csrf_header" th:content="${_csrf.headerName}" />

<head>
	<title>karan Admin - Events</title>
	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
</head>

<main layout:fragment="content">

	<div class="pt-5 mt-5">
		<div class="container mt-4">
			<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1">
				<div class="d-flex justify-content-between align-items-center flex-wrap">
					<h3 class="mb-0">📅 Manage Events</h3>
					<button class="btn btn-primary mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#addEventModal">
						<i class="bi bi-plus-circle me-1"></i> Add Event
					</button>
				</div>
			</div>


			<div class="table-responsive">
				<table class="table table-bordered table-striped align-middle">
					<thead class="table-dark">
						<tr>
							<th>ID</th>
							<th>Title</th>
							<th>Date</th>
							<th>Location</th>
							<th>Type</th>
							<th>Actions</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="event : ${events}">
							<td th:text="${event.id}">1</td>
							<td th:text="${event.title}">Title</td>
							<td th:text="${#temporals.format(event.eventDate, 'yyyy-MM-dd HH:mm')}">Date</td>
							<td th:text="${event.location}">Location</td>
							<td th:text="${event.type}">Type</td>
							<td>
								<button type="button" class="btn btn-sm btn-outline-warning"
									th:attr="data-bs-target='#editEventModal__' + ${event.id}" data-bs-toggle="modal"
									title="Edit">
									<i class="fas fa-edit"></i>
								</button>

								<form th:action="@{'/admin/events/toggle/' + ${event.id}}" method="post"
									style="display:inline;">
									<input type="hidden" name="status"
										th:value="${event.disableStatus == 'Y'} ? 'N' : 'Y'" />
									<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
									<button type="submit" class="btn btn-sm"
										th:classappend="${event.disableStatus == 'Y'} ? 'btn-success' : 'btn-danger'"
										th:text="${event.disableStatus == 'Y'} ? 'Enable' : 'Disable'">
									</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

	<!-- Add Event Modal -->
	<div class="modal fade" id="addEventModal" tabindex="-1" aria-labelledby="addEventModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<div class="modal-content">
				<form th:action="@{/admin/events/add}" method="post">
					<div class="modal-header">
						<h5 class="modal-title" id="addEventModalLabel">Add New Event</h5>
						<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
					</div>
					<div class="modal-body row g-3">
						<div class="col-md-6">
							<label class="form-label">Title</label>
							<input type="text" class="form-control" name="title" required />
						</div>
						<div class="col-md-6">
							<label class="form-label">Brief</label>
							<input type="text" class="form-control" name="brief" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Event Date</label>
							<input type="datetime-local" class="form-control" name="eventDate" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Location</label>
							<input type="text" class="form-control" name="location" />
						</div>
						<div class="col-md-6">
							<label class="form-label">FontAwesome Icon</label>
							<input type="text" class="form-control" name="iconPathName"
								placeholder="fas fa-lightbulb" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Type</label>
							<select class="form-control" name="type">
								<option value="Workshop">Workshop</option>
								<option value="Webinar">Webinar</option>
								<option value="Conference">Conference</option>
							</select>
						</div>
						<div class="col-md-6">
							<label class="form-label">Support Contact</label>
							<input type="text" class="form-control" name="supportContact" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Focus Areas</label>
							<input type="text" class="form-control" name="methodologies" />
						</div>
						<div class="col-md-6">
							<label class="form-label">Registration URL</label>
							<input type="url" class="form-control" name="registrationUrl"
								placeholder="https://example.com/register" />
						</div>
						<div class="col-12">
							<label class="form-label">Description</label>
							<textarea class="form-control" name="description" rows="3"></textarea>
						</div>
						<div class="col-12 text-end mt-4">
							<button type="submit" class="btn btn-success">Submit</button>
							<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
						</div>
					</div>
				</form>
			</div>
		</div>
	</div>

	<!-- Edit Modals -->
	<div th:each="event : ${events}">
		<div class="modal fade" th:id="'editEventModal__' + ${event.id}" tabindex="-1"
			aria-labelledby="editEventModalLabel" aria-hidden="true">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<form th:action="@{'/admin/events/edit/' + ${event.id}}" method="post">
						<div class="modal-header">
							<h5 class="modal-title">Edit Event</h5>
							<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
						</div>
						<div class="modal-body row g-3">
							<div class="col-md-6">
								<label class="form-label">Title</label>
								<input type="text" class="form-control" name="title" th:value="${event.title}"
									required />
							</div>
							<div class="col-md-6">
								<label class="form-label">Brief</label>
								<input type="text" class="form-control" name="brief" th:value="${event.brief}" />
							</div>
							<div class="col-md-6">
								<label class="form-label">Event Date</label>
								<input type="datetime-local" class="form-control" name="eventDate"
									th:value="${#temporals.format(event.eventDate, 'yyyy-MM-dd''T''HH:mm')}" />

							</div>
							<div class="col-md-6">
								<label class="form-label">Location</label>
								<input type="text" class="form-control" name="location" th:value="${event.location}" />
							</div>
							<div class="col-md-6">
								<label class="form-label">FontAwesome Icon</label>
								<input type="text" class="form-control" name="iconPathName"
									th:value="${event.iconPathName}" />
							</div>
							<div class="col-md-6">
								<label class="form-label">Type</label>
								<select class="form-control" name="type">
									<option th:selected="${event.type == 'Workshop'}">Workshop</option>
									<option th:selected="${event.type == 'Webinar'}">Webinar</option>
									<option th:selected="${event.type == 'Conference'}">Conference</option>
								</select>
							</div>
							<div class="col-md-6">
								<label class="form-label">Support Contact</label>
								<input type="text" class="form-control" name="supportContact"
									th:value="${event.supportContact}" />
							</div>
							<div class="col-md-6">
								<label class="form-label">Focus Areas</label>
								<input type="text" class="form-control" name="methodologies"
									th:value="${event.methodologies}" />
							</div>
							<div class="col-md-6">
								<label class="form-label">Registration URL</label>
								<input type="url" class="form-control" name="registrationUrl"
									th:value="${event.registrationUrl}" placeholder="https://example.com/register" />
							</div>
							<div class="col-12">
								<label class="form-label">Description</label>
								<textarea class="form-control" name="description" rows="3"
									th:text="${event.description}"></textarea>
							</div>
							<div class="col-12 text-end mt-4">
								<button type="submit" class="btn btn-success">Update</button>
								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
							</div>
						</div>
					</form>
				</div>
			</div>
		</div>
	</div>

	<!-- Toasts -->
	<div class="position-fixed bottom-0 end-0 p-3" style="z-index: 1055">
		<div th:if="${success}" class="toast text-white bg-success border-0 show" role="alert">
			<div class="d-flex">
				<div class="toast-body" th:text="${success}"></div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
			</div>
		</div>
		<div th:if="${error}" class="toast text-white bg-danger border-0 show" role="alert">
			<div class="d-flex">
				<div class="toast-body" th:text="${error}"></div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button>
			</div>
		</div>
	</div>

	<script>
		document.addEventListener('DOMContentLoaded', function () {
			const toastElList = [].slice.call(document.querySelectorAll('.toast'))
			toastElList.forEach(function (toastEl) {
				new bootstrap.Toast(toastEl, {delay: 4000}).show()
			});
		});
	</script>

</main>

</html>
