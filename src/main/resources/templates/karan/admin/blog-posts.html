<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/layout}"
	xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<title>karan Admin - Blog Posts</title>
	<meta name="_csrf" th:content="${_csrf.token}" />
	<meta name="_csrf_header" th:content="${_csrf.headerName}" />
	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
</head>

<main layout:fragment="content" class="pt-5 mt-5">
	<div class="container mt-4">
		<div class="p-4 rounded shadow-sm bg-light mb-4 border border-1">
			<div class="d-flex justify-content-between align-items-center flex-wrap">
				<h3 class="mb-0">📝 Blog Posts</h3>
				<button class="btn btn-primary mt-2 mt-md-0" data-bs-toggle="modal" data-bs-target="#addBlogModal">
					<i class="bi bi-plus-circle me-1"></i> Add Blog Post
				</button>
			</div>
		</div>


		<div class="table-responsive">
			<table class="table table-bordered table-striped align-middle">
				<thead class="table-dark">
					<tr>
						<th>ID</th>
						<th>Title</th>
						<th>Category</th>
						<th>Summary</th>
						<th>Thumbnail Image</th>
						<th>Published</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody>
					<!-- Fallback if no blogs -->
					<tr th:if="${#lists.isEmpty(blogs)}">
						<td colspan="7" class="text-center text-muted">No blog posts available.</td>
					</tr>

					<!-- Blog rows -->
					<tr th:each="blog : ${blogs}">
						<td th:text="${blog.id}">1</td>
						<td th:text="${blog.title}">Sample Title</td>
						<td th:text="${blog.category.name}">Policy</td>
						<td th:text="${blog.summary}">Short Summary...</td>

						<!-- Thumbnail -->
						<td>
							<img th:if="${blog.thumbnailImage != null}"
								th:src="@{/uploads/blogs/thumbnails/{img}(img=${blog.thumbnailImage})}" alt="Thumbnail"
								class="img-thumbnail" style="height: 60px;" />
							<span th:if="${blog.thumbnailImage == null}" class="text-muted">No image</span>
						</td>

						<!-- Published badge -->
						<td>
							<span th:class="'badge ' + (${blog.published} == 'Y' ? 'bg-success' : 'bg-secondary')"
								th:text="${blog.published} == 'Y' ? 'Published' : 'Draft'"></span>
							<span class="read-count badge bg-info">
								<i class="fa fa-eye"></i>
								<span th:text="${blog.readCount}">0</span> Reads
							</span>
						</td>

						<!-- Actions -->
						<td class="text-nowrap">

							<!-- Edit -->
							<button class="btn btn-sm btn-warning"
								th:attr="data-bs-target='#editBlogModal__' + ${blog.id}" data-bs-toggle="modal">
								<i class="fas fa-edit"></i>
							</button>

							<!-- View -->
							<a class="btn btn-sm btn-info" th:href="@{'/research-publications/' + ${blog.slug}}" target="_blank"
								title="View Blog">
								<i class="fas fa-eye"></i>
							</a>


							<!-- Delete -->
							<form th:action="@{'/admin/blogs/delete/' + ${blog.id}}" method="post"
								style="display:inline;" th:onsubmit="return confirm('Delete blog?');">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
								<button type="submit" class="btn btn-sm btn-danger">
									<i class="fas fa-trash"></i>
								</button>
							</form>

							<!-- Toggle Publish -->
							<form th:action="@{'/admin/blogs/toggle/' + ${blog.id}}" method="post"
								style="display:inline;">
								<input type="hidden" name="status" th:value="${blog.published == 'Y'} ? 'N' : 'Y'" />
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

								<button type="submit" class="btn btn-sm"
									th:classappend="${blog.published == 'Y'} ? 'btn-secondary' : 'btn-success'"
									th:title="${blog.published == 'Y'} ? 'Unpublish this blog' : 'Publish this blog'">
									<i class="fas"
										th:classappend="${blog.published == 'Y'} ? ' fa-eye-slash' : ' fa-upload'"></i>
								</button>
							</form>
						</td>
					</tr>
				</tbody>

			</table>
		</div>
	</div>

	<!-- Add Blog Modal -->
	<div class="modal fade" id="addBlogModal" tabindex="-1" aria-labelledby="addBlogModalLabel" aria-hidden="true">
		<div class="modal-dialog modal-lg">
			<form class="modal-content" th:action="@{/admin/blogs/add}" method="post" enctype="multipart/form-data">
				<div class="modal-header">
					<h5 class="modal-title" id="addBlogModalLabel">Add New Blog Post</h5>
					<button type="button" class="btn-close" data-bs-dismiss="modal"></button>
				</div>

				<div class="modal-body">
					<div class="mb-3">
						<label class="form-label">Title</label>
						<input type="text" class="form-control" name="title" required>
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Category</label>
							<select class="form-select" name="categoryId" id="categoryId" required>
								<option value="" disabled selected>Select Category</option>
								<option th:each="cat : ${blogCategories}" th:value="${cat.id}" th:text="${cat.name}">
								</option>
							</select>
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Author Name</label>
							<input type="text" class="form-control" name="authorName">
						</div>
					</div>

					<div class="mb-3">
						<label class="form-label">Summary</label>
						<textarea class="form-control" name="summary" rows="3"></textarea>
					</div>

					<div class="row">
						<div class="col-md-6 mb-3">
							<label class="form-label">Published Date</label>
							<input type="date" class="form-control" name="publishedAt">
						</div>

						<div class="col-md-6 mb-3">
							<label class="form-label">Cover Image</label>
							<input type="file" class="form-control" name="coverImage" accept="image/*">
						</div>
					</div>



					<div class="col-md-12 mb-3">
						<label class="form-label">Content</label>
						<textarea class="form-control" name="content" id="addContentArea" rows="6" required></textarea>
					</div>

					<div class="col-md-12 mb-3">
						<label class="form-label">Upload Thumbnail Image</label>
						<input type="file" class="form-control" name="thumbnailImage" accept="image/*">
					</div>

				</div>

				<div class="modal-footer">
					<button class="btn btn-success" type="submit">Submit</button>
					<button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
				</div>
			</form>
		</div>
	</div>


	<!-- Edit Blog Modals -->
	<div th:if="${blogs != null}">
		<div th:each="blog : ${blogs}" th:if="${blog != null}">
			<div class="modal fade" th:id="'editBlogModal__' + ${blog.id}" tabindex="-1"
				aria-labelledby="editBlogModalLabel" aria-hidden="true">
				<div class="modal-dialog modal-xl">
					<div class="modal-content">
						<form th:action="@{/admin/blogs/edit}" method="post" enctype="multipart/form-data">
							<input type="hidden" name="id" th:value="${blog?.id}" />

							<div class="modal-header">
								<h5 class="modal-title" id="editBlogModalLabel">Edit Blog</h5>
								<button type="button" class="btn-close" data-bs-dismiss="modal"
									aria-label="Close"></button>
							</div>

							<div class="modal-body">
								<div class="row">
									<!-- Left Column -->
									<div class="col-md-6">
										<div class="mb-3">
											<label class="form-label">Title</label>
											<input type="text" class="form-control" name="title"
												th:value="${blog?.title}" required />
										</div>

										<div class="row">
											<div class="col-md-6 mb-3">
												<label class="form-label">Category</label>
												<select class="form-select" name="categoryId" required>
													<option value="" disabled selected>Select category</option>
													<option th:each="cat : ${blogCategories}" th:value="${cat.id}"
														th:text="${cat.name}"
														th:selected="${blog != null and blog.category != null and cat.id == blog.category.id}">
													</option>
												</select>
											</div>

											<div class="col-md-6 mb-3">
												<label class="form-label">Author Name</label>
												<input type="text" class="form-control" name="authorName"
													th:value="${blog?.authorName}" />
											</div>
										</div>

										<div class="mb-3">
											<label class="form-label">Summary</label>
											<textarea class="form-control" name="summary" rows="3"
												th:text="${blog?.summary}"></textarea>
										</div>

										<div class="mb-3">
											<label class="form-label">Published Date</label>
											<input type="date" class="form-control" name="publishedAt"
												th:value="${blog != null and blog.publishedAt != null} ? ${#temporals.format(blog.publishedAt, 'yyyy-MM-dd')} : ''" />
										</div>
										<div class="mb-3">
											<label class="form-label">Replace Cover Image (optional)</label>
											<input type="file" class="form-control" name="coverImage"
												accept="image/*" />
										</div>
									</div>

									<!-- Right Column -->
									<div class="col-md-6">
										<label class="form-label">Content</label>
										<textarea class="form-control ckeditor" name="content"
											th:id="'editContentArea__' + ${blog.id}" th:text="${blog?.content}"
											rows="12"></textarea>
									</div>

									<div class="col-md-12 mb-3">
										<label class="form-label">Upload Thumbnail Image</label>
										<input type="file" class="form-control" name="thumbnailImage" accept="image/*">
									</div>


								</div>
							</div>

							<div class="modal-footer">
								<button type="submit" class="btn btn-success">Update</button>
								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
							</div>
						</form>
					</div>
				</div>
			</div>
		</div>
	</div>


	<script>
		document.addEventListener("DOMContentLoaded", function () {
			if (!CKEDITOR.instances['addContentArea']) {
				CKEDITOR.replace('addContentArea');
			}

			document.querySelectorAll("textarea[id^='editContentArea__']").forEach(function (textarea) {
				const id = textarea.id;
				if (!CKEDITOR.instances[id]) {
					CKEDITOR.replace(id);
				}
			});

			document.querySelectorAll("form").forEach(function (form) {
				form.addEventListener('submit', function () {
					for (const instanceId in CKEDITOR.instances) {
						if (CKEDITOR.instances.hasOwnProperty(instanceId)) {
							CKEDITOR.instances[instanceId].updateElement();
							//console.log("Updating CKEditor instance:", instanceId);
						}
					}

					//console.log("Submitting form:", form);
				});
			});
		});
	</script>

</main>

</html>
