	<script>
		document.addEventListener("DOMContentLoaded", function () {
			const viewButtons = document.querySelectorAll(".view-gallery-btn");
			const slideContainer = document.getElementById("slide-container");
			const thumbnailGallery = document.getElementById("thumbnail-gallery");

			viewButtons.forEach(button => {
				button.addEventListener("click", function () {
					const groupId = this.getAttribute("data-groupid");

					fetch(`/gallery/group/${groupId}/media`)
						.then(response => response.json())
						.then(data => {
							slideContainer.innerHTML = "";
							thumbnailGallery.innerHTML = "";

							if (data.length === 0) {
								slideContainer.innerHTML = `
									<div class="slide active d-flex justify-content-center align-items-center text-white" style="height: 100%;">
										<p class="text-center fs-4 text-white">No media available for this event!.</p>
									</div>
								`;
								thumbnailGallery.innerHTML = "";
								return;
							}

							data.forEach((media, index) => {
								let slideHTML = "";
								if (media.type === "video") {
									slideHTML = `<div class="slide" data-type="video" data-src="${media.url}"></div>`;
								} else {
									slideHTML = `<div class="slide" data-type="image" style="background-image: url('${media.url}');" data-src="${media.url}"></div>`;
								}
								slideContainer.insertAdjacentHTML("beforeend", slideHTML);

								const thumbHTML = `
									<div class="thumbnail-item" data-index="${index}">
										<img src="${media.thumbnailUrl || media.url}" alt="thumb${index}" />
									</div>
								`;
								thumbnailGallery.insertAdjacentHTML("beforeend", thumbHTML);
							});

							initializeModalSlider();
						});

				});
			});

			function initializeModalSlider() {
				const slides = document.querySelectorAll('.slide');
				const thumbnails = document.querySelectorAll('.thumbnail-item');
				const prevBtn = document.getElementById('prev');
				const nextBtn = document.getElementById('next');
				let currentSlide = 0;

				function showSlide(index) {
					slides.forEach((slide, i) => {
						slide.classList.remove('active');
						thumbnails[i].classList.remove('active');
						if (slide.dataset.type === 'video') {
							slide.innerHTML = '';
						}
					});

					const selectedSlide = slides[index];
					selectedSlide.classList.add('active');
					thumbnails[index].classList.add('active');

					if (selectedSlide.dataset.type === 'video') {
						const video = document.createElement('video');
						video.src = selectedSlide.dataset.src;
						video.autoplay = true;
						video.muted = true;
						video.loop = true;
						video.playsInline = true;
						selectedSlide.appendChild(video);
					}

					currentSlide = index;
					thumbnails[index].scrollIntoView({behavior: 'smooth', inline: 'center'});
				}

				thumbnails.forEach(item => {
					item.addEventListener('click', () => {
						const index = parseInt(item.dataset.index);
						showSlide(index);
					});
				});

				if (prevBtn && nextBtn) {
					prevBtn.onclick = () => {
						currentSlide = (currentSlide - 1 + slides.length) % slides.length;
						showSlide(currentSlide);
					};

					nextBtn.onclick = () => {
						currentSlide = (currentSlide + 1) % slides.length;
						showSlide(currentSlide);
					};
				}

				showSlide(currentSlide);
			}
		});
	</script>
