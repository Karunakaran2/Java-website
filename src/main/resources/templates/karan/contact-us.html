	<script>
		$(document).ready(function () {
			$('#contactForm').submit(function (e) {
				e.preventDefault();

				$.ajax({
					type: 'POST',
					url: '/contact-us',
					data: $(this).serialize(),
					success: function (response) {
						//alert(response); // or show it in a div
						$('#formResponseMsgSuccess').removeClass('d-none').text(response);
						$('#contactForm')[0].reset();
						setTimeout(() => {
							$('#formResponseMsg').addClass('d-none');
						}, 5000);
					},
					error: function (xhr) {
						$('#formResponseMsgError').removeClass('d-none').text(response);
						setTimeout(() => {
							$('#formResponseMsgError').addClass('d-none');
						}, 5000);
						//alert('An error occurred while submitting the form.');
					}
				});
			});
			var path = document.getElementById("drawingPath");
			    if (!path) return;

			    var length = path.getTotalLength();
			    path.style.strokeDasharray = length;
			    path.style.strokeDashoffset = length;
			    path.style.transition = "stroke-dashoffset 5s linear";

			    var animated = false;

			    function animatePath() {
			        if (!animated) {
			            path.style.strokeDashoffset = 0;
			            animated = true;
			        }
			    }

			    if ('IntersectionObserver' in window) {
			        var observer = new IntersectionObserver(function(entries) {
			            entries.forEach(function(entry) {
			                if (entry.isIntersecting) {
			                    animatePath();
			                    observer.disconnect();
			                }
			            });
			        }, { threshold: 0.5 });
			        observer.observe(path);
			    } else {
			        // Fallback for old browsers
			        window.addEventListener('scroll', function onScroll() {
			            var rect = path.getBoundingClientRect();
			            if (rect.top < window.innerHeight && rect.bottom > 0) {
			                animatePath();
			                window.removeEventListener('scroll', onScroll);
			            }
			        });
			    }
		});
		
	

	</script>
