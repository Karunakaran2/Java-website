<!DOCTYPE html>
<html xmlns:layout="http://www.w3.org/1999/xhtml" layout:decorate="~{layouts/layout}"
	xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
	<title>karan Admin - Case Studies</title>
	<meta id="_csrf" name="_csrf" th:content="${_csrf.token}" />
	<meta id="_csrf_header" name="_csrf_header" th:content="${_csrf.headerName}" />
	<link rel="icon" type="image/x-icon" th:href="@{/website/img/favicon.png}" />
</head>

<main layout:fragment="content" class="pt-5 mt-5">
	<div class="pt-5 mt-5 container">

		<!-- Heading -->
		<div class="p-4 rounded shadow-sm bg-light border mb-4">
			<div class="d-flex justify-content-between align-items-center">
				<h3 class="mb-0">📂 Blog Categories</h3>
				<a href="/admin/dashboard" class="btn btn-outline-secondary btn-sm">
					<i class="bi bi-box-arrow-left me-1"></i> Exit Setup
				</a>
			</div>
		</div>


		<!-- Flash Message -->
		<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
			<span th:text="${success}">Category saved successfully!</span>
			<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
		</div>

		<!-- Category Form -->
		<div class="p-4 rounded shadow-sm bg-white border mb-4">
			<form th:action="@{/admin/setup/blog-categories/save}" method="post" th:object="${newCategory}">
				<div class="row g-3">
					<div class="col-md-6">
						<label for="title" class="form-label">Category Title</label>
						<input type="text" id="name" name="title" th:field="*{name}" class="form-control" required>
					</div>
					<div class="col-md-6 d-flex align-items-end">
						<div class="justify-content-end">
							<button type="submit" class="btn btn-success mb-1">Save Category</button>
						</div>
					</div>
				</div>
			</form>
		</div>

		<!-- Category Table -->
		<div class="table-responsive">
			<table class="table table-hover table-bordered align-middle text-center shadow-sm bg-white">
				<thead class="table-primary">
					<tr>
						<th>#</th>
						<th>Title</th>
						<th>Status</th>
						<th>Actions</th>
					</tr>
				</thead>
				<tbody>
					<tr th:if="${#lists.isEmpty(blogCategories)}">
						<td colspan="4" class="text-muted">No categories found.</td>
					</tr>
					<tr th:each="category, iStat : ${blogCategories}">
						<td th:text="${iStat.count}">1</td>
						<td th:text="${category.name}">Tech</td>
						<td>
							<span th:text="${category.disableStatus == 'N' ? 'Active' : 'Inactive'}"
								th:classappend="${category.disableStatus == 'N'} ? 'text-success' : 'text-danger'">
							</span>
						</td>
						<td>
							<form th:action="@{/admin/setup/blog-categories/toggle/{id}(id=${category.id})}" method="post"
								style="display:inline;">
								<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
								<button type="submit" class="btn btn-sm"
									th:classappend="${category.disableStatus == 'N'} ? 'btn-danger' : 'btn-success'"
									th:text="${category.disableStatus == 'N'} ? 'Deactivate' : 'Activate'">
								</button>
							</form>
						</td>
					</tr>
				</tbody>
			</table>
		</div>

	</div>
</main>
