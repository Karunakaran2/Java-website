		document.addEventListener("DOMContentLoaded", function () {
			if (window.location.pathname === "/") {
				lottie.loadAnimation({ //By kk
					container: document.getElementById('sk-loader'),
					renderer: 'svg',
					loop: true,
					autoplay: true,
					path: '../website/js/karanLoader-sgk.json'
				});

				const loader = document.getElementById("sk-loader-wrapper");
				const content = document.getElementById("main-content");

				window.addEventListener("load", function () {
					const minLoadingTime = 2000;
					const startTime = performance.now();

					const elapsed = performance.now() - startTime;
					const delay = Math.max(0, minLoadingTime - elapsed);

					setTimeout(() => {
						loader.style.transition = "opacity 0.5s ease";
						loader.style.opacity = "0";

						setTimeout(() => {
							loader.style.display = "none";
							content.style.display = "block";
						}, 300); // fade duration
					}, delay);
				});
			} else {
				const loader = document.getElementById("sk-loader-wrapper");
				const content = document.getElementById("main-content");

				if (loader) loader.style.display = "none";
				if (content) content.style.display = "block";
			}
		});

	<script type="text/javascript">
const accordions = document.querySelectorAll(
		  ".accordion-highlights .accordion"
		);
		const accordionImages = document.querySelector(
		  ".accordion-highlights .accordion_images"
		);

		// Function to open an accordion
		const openAccordion = (accordion) => {
		  accordion.classList.add("accordion_active");
		};

		// Function to close an accordion
		const closeAccordion = (accordion) => {
		  accordion.classList.remove("accordion_active");
		};

		// Function to activate images
		const activateImages = (index) => {
		  const images = accordionImages.querySelectorAll(".accordion_contentt");
		  images.forEach((div, i) => {
		    if (i === index) {
		      div.classList.add("active");
		    } else {
		      div.classList.remove("active");
		    }
		  });
		};

		// Function to toggle an accordion
		const toggleAccordion = (accordion, index) => {
		  if (accordion.classList.contains("accordion_active")) {
		    // If the clicked accordion is already open, do nothing
		    return;
		  }
		  accordions.forEach((acc) => closeAccordion(acc)); // Close all accordions
		  openAccordion(accordion); // Open the clicked accordion
		  activateImages(index);
		};

		// Add click event listener to each accordion
		accordions.forEach((accordion, index) => {
		  const intro = accordion.querySelector(".accordion_intro");

		  intro.onclick = () => {
		    toggleAccordion(accordion, index);
		  };
		});

		// Default: open the first accordion
		const firstAccordion = document.querySelectorAll(".accordion_intro")[0];
		openAccordion(firstAccordion, 0);

		</script>
